
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clothing Gallery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"       rel="stylesheet">
    <link rel="stylesheet" href="/Css/Gallary.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1> Vince Fashion Gallary </h1>

        <nav>
            <a href="#home">Home</a>
            <a href="#gallery">Gallery</a>
            <a href="#about">About</a>
        </nav>
    </header>


    <!-- Home -->
    <section class="home " id="home">

        <h2>Welcome to Fashion Gallary</h2>

        <p class="text-danger">Simple and stylish clothes for everyone.</p>

        <a href="#gallery" class="container">View Products</a>

    </section>


    <!-- Gallery -->
    <section class="gallery" id="gallery">

        <h2>Our Products</h2>

        <div class="products">

            <!-- Product 1 -->
            <div class="product mt-3 p-4">

                <img src="/images/f1.jpg" alt="T-Shirt">

                <h3>Polo 1</h3>

                <p>₱800</p>

                <button onclick="showProduct('Polo 1', '₱800')">
                    View Product
                </button>

            </div>


            <!-- Product 2 -->
            <div class="product mt-3 p-4">

                <img src="/images/f2.jpg" alt="Jeans">

                <h3>Polo 2</h3>

                <p>₱800</p>

                <button onclick="showProduct('Polo 2', '₱800')">
                    View Product
                </button>

            </div>


            <!-- Product 3 -->
            <div class="product mt-3 p-4">

                <img src="/images/f3.jpg" alt="Jacket">

                <h3>Polo 3</h3>

                <p>₱800</p>

                <button onclick="showProduct('Polo 3', '₱800')">
                    View Product
                </button>

            </div>


            <!-- Product 4 -->
            <div class="product mt-3 p-4">

                <img src="/images/f4.jpg" alt="Dress">

                <h3>Polo 4</h3>

                <p>₱800</p>

                <button onclick="showProduct('Polo', '₱800')">
                    View Product
                </button>

            </div>

        </div>

    </section>


    
    


    <!-- Footer -->
    <footer>

        <p>© 2026 Fashion Store</p>

    </footer>


    <!-- Popup -->
    <div id="popup" class="popup">

        <div class="popup-content">

            <span onclick="closeProduct()" class="close">
                &times;
            </span>

            <h2 id="productName"></h2>

            <p id="productPrice"></p>

            <button onclick="addToCart()">
                Add to Cart
            </button>

        </div>

    </div>


    <script src="/Js/gallary.js"></script>

</body>

</html>
